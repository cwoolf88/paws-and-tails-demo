name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

concurrency:
  group: paws-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Lint, unit, integration, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          path: paws-and-tails-demo

      - name: Checkout anemone-server-js
        uses: actions/checkout@v4
        with:
          repository: cwoolf88/anemone-server-js
          path: anemone-server-js
          token: ${{ secrets.GH_PRIVATE_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            paws-and-tails-demo/package-lock.json
            anemone-server-js/package-lock.json

      - name: Build SDK
        working-directory: anemone-server-js
        run: |
          npm ci
          npm run build

      - name: Install app deps
        working-directory: paws-and-tails-demo
        run: npm ci

      - name: Lint
        working-directory: paws-and-tails-demo
        run: npm run lint

      - name: Unit tests
        working-directory: paws-and-tails-demo
        run: npm run test:unit

      - name: Integration tests
        working-directory: paws-and-tails-demo
        run: npm run test:integration

      - name: Production build
        working-directory: paws-and-tails-demo
        env:
          ANEMONE_USE_MOCK: "1"
          NEXT_PUBLIC_APP_NAME: "Paws and Tails"
          NEXT_PUBLIC_APP_ENV: test
          APP_ENV: test
        run: npm run build

  deploy:
    name: Deploy to Amplify
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'test' && 'test' || 'development' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Cancel in-progress Amplify jobs
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          JOBS=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" --max-results 20 --query 'jobSummaries[?status==`RUNNING` || status==`PENDING`].jobId' --output text)
          for JOB_ID in $JOBS; do
            echo "Cancelling Amplify job $JOB_ID"
            aws amplify stop-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" || true
          done

      - name: Start Amplify release
        id: start
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify job
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ github.ref_name }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "Amplify status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for Amplify"
          exit 1
