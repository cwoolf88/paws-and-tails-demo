version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - |
              if [ ! -d ../anemone-server-js ]; then
                if [ -n "${GH_PRIVATE_REPO_TOKEN:-}" ]; then
                  git clone --depth 1 https://x-access-token:${GH_PRIVATE_REPO_TOKEN}@github.com/cwoolf88/anemone-server-js.git ../anemone-server-js
                else
                  git clone --depth 1 https://github.com/cwoolf88/anemone-server-js.git ../anemone-server-js
                fi
              fi
            - (cd ../anemone-server-js && npm ci && npm run build)
            - npm ci
        build:
          commands:
            # Amplify build env is not available to Next SSR compute unless written here.
            # See: https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
            - |
              set -euo pipefail
              git fetch --tags --force origin 2>/dev/null || true
              VERSION="$(git describe --tags --match 'v*' --exact-match 2>/dev/null || true)"
              if [ -z "${VERSION}" ]; then
                VERSION="$(git describe --tags --match 'v*' --abbrev=7 2>/dev/null || true)"
              fi
              COMMIT="${AWS_COMMIT_ID:-$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)}"
              if [ -z "${VERSION}" ]; then
                VERSION="0.0.0-dev+${COMMIT}"
              fi
              export NEXT_PUBLIC_APP_VERSION="${VERSION}"
              export APP_VERSION="${VERSION}"
              export NEXT_PUBLIC_APP_COMMIT="${COMMIT}"
              export APP_COMMIT="${COMMIT}"
              echo "Resolved app version=${VERSION} commit=${COMMIT}"
              env | grep -e NEXT_PUBLIC_ >> .env.production || true
              env | grep -e APP_ENV -e APP_VERSION -e APP_COMMIT -e ANEMONE_ -e PAWS_ >> .env.production || true
              echo "env_production_lines=$(wc -l < .env.production)"
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../anemone-server-js/node_modules/**/*
      buildPath: /
